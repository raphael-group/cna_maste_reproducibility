# Input paths shared by every benchmarked method, per dataset; configs/<method>.<case>.yaml names its dataset.
#
# Runpeng Luo (2026-11-03)
#
# Paths are on the ragr cluster. Inputs are read only; inputs_dir is written once by
# scripts/common/prepare_sim_inputs.smk and read by Clonalscope and Numbat.
datasets:
  ovarian:
    # Visium HD 3prime ovarian: Space Ranger 16um bins and the UGP outputs over them.
    samples:
      H1-N3KXRGQ:
        matrix_016um: /opt/ragr/datasets/Visium_HD_3prime/ovarian/10x_rawdata/outs/binned_outputs/square_016um/filtered_feature_bc_matrix
        ugp_pileup: /n/fs/ragr-data/datasets/Visium_HD_3prime/output_10092026/H1-N3KXRGQ/pileup/VISIUM3prime_U1
        ugp_phase: /n/fs/ragr-data/datasets/Visium_HD_3prime/output_10092026/H1-N3KXRGQ/phase
        # NB: bin size (um) -> UGP bb-<XXX>um-formatted dir (results/format_bb/README.md), CalicoST's input
        ugp_bb:
          16: /n/fs/ragr-data/datasets/Visium_HD_3prime/output_10092026/H1-N3KXRGQ/bb-016um-formatted
          32: /n/fs/ragr-data/datasets/Visium_HD_3prime/output_10092026/H1-N3KXRGQ/bb-032um-formatted
  calicost-sim:
    # 90 CalicoST simulations, doi:10.5281/zenodo.14175627, unzipped.
    deposit: /n/fs/ragr-data/datasets/cnamaste-benchmark/CalicoST_simulation_deposit
    sim_dir: /n/fs/ragr-data/datasets/cnamaste-benchmark/CalicoST_simulation_deposit/simulated_data_related
    # NB: <inputs_dir>/<sim>/filtered_feature_bc_matrix, 10x matrices converted from each simulation's h5ad
    inputs_dir: /n/fs/ragr-data/datasets/cnamaste-benchmark/benchmark/inputs
