# Reference files and software shared by the benchmarked methods.
#
# Runpeng Luo (2026-11-03)
#
# Paths are on the ragr cluster. Numbat's expression reference (numbat::ref_hca) and gene annotation
# (gtf_hg38) ship with the package, so they have no entry here. The conda root is in scripts/common/config.sh:
# its python reads this file.
references:
  # NB: every method runs on GRCh38; run_numbat() takes it as genome = "hg38"
  genome: hg38
  # NB: Cell Ranger GRCh38-2020-A gene table, Ensembl IDs of the simulation 10x inputs (common/h5ad_to_10x.py)
  ordered_genes: /n/fs/ragr-data/users/congma/references/cellranger_refdata-gex-GRCh38-2020-A/genes/ordered_genes.tsv
  # NB: Eagle2 genetic map, read by numbat:::preprocess_allele (numbat/build_allele_counts.R)
  eagle_gmap: /opt/ragr/users2/rl6004/bin/Eagle_v2.4.1/tables/genetic_map_hg38_withX.txt.gz
  # NB: Clonalscope data-raw/ at 07dd0c5: sizes, cyclegenes, hg38 genes BED, cytoarm table
  clonalscope_data_raw: /n/fs/ragr-data/datasets/cnamaste-benchmark/benchmark/clonalscope/ref/clonalscope_data-raw_07dd0c5
  # NB: CalicoST GRCh38_resources at c1abcae, keyed by their configuration_cna names
  calicost:
    geneticmap_file: /n/fs/ragr-research/users/rl6004/projects/proj-spatial-cna/CalicoST/GRCh38_resources/genetic_map_GRCh38_merged.tab.gz
    hgtable_file: /n/fs/ragr-research/users/rl6004/projects/proj-spatial-cna/CalicoST/GRCh38_resources/hgTables_hg38_gencode.txt
    filtergenelist_file: /n/fs/ragr-research/users/rl6004/projects/proj-spatial-cna/CalicoST/GRCh38_resources/ig_gene_list.txt
    filterregion_file: /n/fs/ragr-research/users/rl6004/projects/proj-spatial-cna/CalicoST/GRCh38_resources/HLA_regions.bed
software:
  # NB: conda env prefix per method, built from envs/<method>.yaml
  envs:
    calicost: /n/fs/ragr-research/users/rl6004/envs/calicost_env
    clonalscope: /n/fs/ragr-research/users/rl6004/envs/clonalscope_env
    numbat: /n/fs/ragr-research/users/rl6004/envs/numbat_env
  # NB: CalicoST clone at c1abcae, pip install -e into envs.calicost
  calicost_repo: /n/fs/ragr-research/users/rl6004/projects/proj-spatial-cna/CalicoST
