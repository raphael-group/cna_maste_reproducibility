# CalicoST on Visium HD 3prime ovarian H1-N3KXRGQ.
# inputs: UGP bb-<XXX>um-formatted dirs (configs/datasets.yaml ugp_bb), staged by scripts/calicost/stage_input.sh
#   to <staged_dir>/<name> (unique_snp_ids.npy re-saved for numpy 1.24).
# runs: in order, each under a cgroup MemoryMax (default half of RAM). scripts/calicost/ovarian_config.py
#   writes each run's configuration_cna: its staged input, output_dir <outdir>/<tag>, the CalicoST resources
#   of configs/metadata.yaml, configuration_cna below, then the run's own keys.
dataset: ovarian
staged_dir: /n/fs/ragr-data/datasets/Visium_HD_3prime/benchmark/calicost/input
outdir: /n/fs/ragr-data/datasets/Visium_HD_3prime/benchmark/calicost
mem_max: ""  # NB: empty = half of MemTotal
inputs:
  H1-N3KXRGQ_016um: {sample: H1-N3KXRGQ, bin_um: 16}
  H1-N3KXRGQ_032um: {sample: H1-N3KXRGQ, bin_um: 32}
# NB: CalicoST's default configuration_cna; a key left out takes the arg_parse.py default
configuration_cna:
  normalidx_file: None
  tumorprop_file: None
  supervision_clone_file: None
  secondary_min_umi: 300
  bafonly: False
  nu: 1.0
  logphase_shift: -2.0
  npart_phasing: 3
  n_clones: 3
  n_clones_rdr: 2
  min_spots_per_clone: 100
  min_avgumi_per_clone: 10
  maxspots_pooling: 7
  tumorprop_threshold: 0.5
  max_iter_outer: 20
  nodepotential: weighted_sum
  initialization_method: rectangle
  num_hmrf_initialization_start: 0
  num_hmrf_initialization_end: 1
  spatial_weight: 1.0
  construct_adjacency_method: hexagon
  construct_adjacency_w: 1.0
  n_states: 7
  params: smp
  t: 1-1e-5
  t_phaseing: 0.9999
  fix_NB_dispersion: False
  shared_NB_dispersion: True
  fix_BB_dispersion: False
  shared_BB_dispersion: True
  max_iter: 30
  tol: 0.0001
  gmm_random_state: 0
  np_threshold: 1.0
  np_eventminlen: 10
  nonbalance_bafdist: 1.0
  nondiploid_rdrdist: 10.0
# NB: tag -> staged input and the configuration_cna keys it sets; msu<N> sets min_snpumi_perspot = N (default 50)
runs:
  H1-N3KXRGQ_016um_msu50: {input: H1-N3KXRGQ_016um}
  H1-N3KXRGQ_016um_msu25: {input: H1-N3KXRGQ_016um, min_snpumi_perspot: 25}
  H1-N3KXRGQ_016um_msu20: {input: H1-N3KXRGQ_016um, min_snpumi_perspot: 20}
  H1-N3KXRGQ_016um_msu15: {input: H1-N3KXRGQ_016um, min_snpumi_perspot: 15}
  H1-N3KXRGQ_016um_msu10: {input: H1-N3KXRGQ_016um, min_snpumi_perspot: 10}
  H1-N3KXRGQ_032um: {input: H1-N3KXRGQ_032um}
