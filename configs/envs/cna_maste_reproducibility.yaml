# Root environment: runs run_cna_maste_reproducibility.smk and the tools its own rules call; every method runs in
# its own environment (configs/cna_maste_reproducibility.yaml ENVS).
#
#   mamba env create -p <ENVS.cna_maste_reproducibility> -f configs/envs/cna_maste_reproducibility.yaml
name: cna_maste_reproducibility
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.16
  - snakemake-minimal=9.27.1
  - pyyaml=6.0.3
  - pandas=3.1.1
  - pyarrow=26.0.1
  - pysam=0.24.1  # NB: Universal-Genotyping-Pipeline resources/scripts/convert_bam_visium3prime.py
  - uv=0.13.7
  - git=2.56.0
  - curl=8.23.0
  # NB: cnamaste's native solvers (build_cnamaste_expansion, build_cnamaste_opengm); gcc 14+ rejects OpenGM's templates
  - rust=1.100.0
  - gcc=13.4.0
  - gxx=13.4.0
  - libboost-headers=1.92.0
