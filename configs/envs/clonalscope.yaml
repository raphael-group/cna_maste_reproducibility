# Clonalscope env for the tutorial-setting benchmark (CLONALSCOPE_ENV of configs/cna_maste_reproducibility.yaml).
channels:
  - conda-forge
  - bioconda
dependencies:
  - snakemake-minimal=9.27.1
  - r-base=4.5.3
  - r-remotes=2.5.0
  # NB: Clonalscope 07dd0c5 NAMESPACE imports, DESCRIPTION Depends/Imports, and viridis:: in FindNormalReference
  - r-matrix=1.7_6
  - r-data.table=1.18.6.1
  - bioconductor-rtracklayer=1.70.1
  - r-seurat=5.5.1
  - bioconductor-aucell=1.32.0
  - bioconductor-biocfilecache=3.2.0
  - bioconductor-gseabase=1.72.0
  - r-hiddenmarkov=1.8_14
  - r-rcolorbrewer=1.1_3
  - r-amap=0.8_20
  - r-catools=1.18.4
  - r-pheatmap=1.0.13
  - r-stringr=1.6.0
  - r-uwot=0.2.5
  - r-matrixstats=1.5.0
  - r-ggplot2=4.0.3
  - r-cowplot=1.2.0
  - r-viridis=0.6.5

# After the env is created, the setup step installs Clonalscope from CLONALSCOPE_REPO, its clone at the benchmarked
# commit 07dd0c576b6754d18dda86ec8905d8a9be5e77b0 (pure R; deps satisfied above):
#   Rscript -e 'remotes::install_local("<CLONALSCOPE_REPO>", upgrade = "never")'
