# Local copies of the benchmark's runs, the schema of benchmark.remote.yaml (the cluster copies).
# A relative path is under the benchmark's directory (`read_method_input.get_benchmark_path`), an absolute one read
# as given.
# A run: `dir` the directory a `read_method_input` reader takes, `labels` its spot clones, `profile` its copy numbers.
# A run key beyond `numbat`, `clonalscope`, `calicost`, `cnamaste` and `cell_type` names its variant, from its directory's name.
# `runtime`: a sample's runs' runtime table, `method`, `setting`, `resolution [um]`, `Runtime [mins]`, `Memory [GB]`.
# `simulation`: the simulations' truth (`groundtruth_dir`, a directory per simulation), runtime table, and each
# method's run of one simulation, `dir` a template of its `sample_id`.
vishd:
  H1-N3KXRGQ:
    runtime: input_data/real_data/runtime.H1-N3KXRGQ.tsv
    ugp:
      dir: input_data/real_data/output_10092026/H1-N3KXRGQ
      spots: input_data/real_data/output_10092026/H1-N3KXRGQ/bb/MSR300/VISIUM3prime/barcodes.tsv.gz
      spaceranger_dir: input_data/real_data/output_10092026/H1-N3KXRGQ/bb-032um
